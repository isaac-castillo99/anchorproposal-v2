services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anchorproposal
      POSTGRES_PASSWORD: anchorproposal
      POSTGRES_DB: anchorproposal
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
